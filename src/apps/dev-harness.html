<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scaffold MCP Apps — dev harness</title>
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
        font: 14px/1.4 system-ui, sans-serif;
        background: #e9edf2;
        color: #1b2733;
      }
      nav {
        padding: 16px;
        background: #fff;
        border-right: 1px solid #d8dee6;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      nav h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      nav a {
        padding: 6px 10px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }
      nav a[data-view='independence-report'] {
        border-left: 3px solid #4a90d9;
      }
      nav a[data-view='step-card'] {
        border-left: 3px solid #2ec4b6;
      }
      nav a[data-view='suggestions'] {
        border-left: 3px solid #ffb547;
      }
      nav a[data-view='progress'] {
        border-left: 3px solid #5bd08a;
      }
      nav a.on {
        background: #1b2733;
        color: #fff;
      }
      main {
        padding: 24px;
        display: grid;
        gap: 16px;
        align-content: start;
        justify-items: start;
      }
      #device {
        padding: 14px;
        border-radius: 26px;
        background: #11161c;
        box-shadow: 0 20px 50px rgb(0 0 0 / 25%);
      }
      #device[data-view='independence-report'] {
        background: #fff;
        padding: 0;
        border-radius: 12px;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        border-radius: 12px;
      }
      #log {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 12px/1.5 ui-monospace, monospace;
        max-width: 820px;
        max-height: 260px;
        overflow: auto;
      }
      #log code {
        color: #4a5a6b;
      }
      body.shot {
        display: block;
        background: transparent;
      }
      body.shot nav,
      body.shot #log {
        display: none;
      }
      body.shot main {
        padding: 0;
      }
      body.shot #device {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }
      body.shot iframe {
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <nav id="scenarios"><h1>Scaffold views</h1></nav>
    <main>
      <div id="device"></div>
      <ol id="log"></ol>
    </main>
    <script type="module" src="./dev-harness.ts"></script>
  </body>
</html>
