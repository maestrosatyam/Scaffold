AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Scaffold - self-hosted MCP server (Streamable HTTP, MCP 2025-11-25) for an Alexa+ routine coach.
  One Lambda (Function URL) serves /mcp, the demo API and the simulator; DynamoDB holds the event log.
  Designed for free-tier / near-zero cost. Tear down with: sam delete --stack-name <name>

Parameters:
  AllowedHosts:
    Type: String
    Default: ''
    Description: Comma-separated Host header allowlist (set to the Function URL hostname after first deploy).
  Tokens:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional static SCAFFOLD_TOKENS (token=personId:role:actorId,...). Empty = no static tokens; judges use demo sandboxes (POST /api/demo/sandbox).
  TokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret for stateless demo-sandbox tokens (e.g. output of `openssl rand -hex 32`). Shared by all instances.
  TimeZone:
    Type: String
    Default: America/Los_Angeles
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional address for budget alerts (80% and 100% of actual spend, 100% forecast).
  BudgetLimitUsd:
    Type: Number
    Default: 20
    Description: Monthly cost cap in USD (credits not deducted). At 100% of actual spend the guard throttles the function to zero.

Conditions:
  HasEmail: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: seq, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: seq, KeyType: RANGE }
      SSESpecification: { SSEEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  ScaffoldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda
      Handler: dist/server-js/server/lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          NODE_ENV: production
          SCAFFOLD_ANONYMOUS: none
          SCAFFOLD_TOKEN_SECRET: !Ref TokenSecret
          SCAFFOLD_STORE: dynamodb
          SCAFFOLD_TABLE: !Ref EventsTable
          SCAFFOLD_TZ: !Ref TimeZone
          ALLOWED_HOSTS: !Ref AllowedHosts
          SCAFFOLD_TOKENS: !Ref Tokens
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogGroup: !Ref FunctionLogs

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scaffold Lambda errors (judging-period uptime watch)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ScaffoldFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Cost cap: the budget publishes to this topic at 100% of actual spend, and the guard sets the
  # function's reserved concurrency to 0 (every request is throttled, so it stops costing money).
  # Budgets refresh a few times a day, so the cap is approximate. Undo after review with:
  #   aws lambda delete-function-concurrency --function-name <ScaffoldFunction>
  BudgetTopic:
    Type: AWS::SNS::Topic

  BudgetTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BudgetTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: SNS:Publish
            Resource: !Ref BudgetTopic
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId } }

  BudgetGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          TARGET: !Ref ScaffoldFunction
      InlineCode: |
        const { LambdaClient, PutFunctionConcurrencyCommand } = require('@aws-sdk/client-lambda');
        const lambda = new LambdaClient({});
        exports.handler = async (event) => {
          console.log('budget alert:', (event.Records ?? []).map((r) => r.Sns && r.Sns.Subject).join('; '));
          await lambda.send(new PutFunctionConcurrencyCommand({ FunctionName: process.env.TARGET, ReservedConcurrentExecutions: 0 }));
          return { throttled: process.env.TARGET };
        };
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource: !GetAtt ScaffoldFunction.Arn
      Events:
        BudgetAlert:
          Type: SNS
          Properties: { Topic: !Ref BudgetTopic }

  CostBudget:
    Type: AWS::Budgets::Budget
    DependsOn: BudgetTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-cap'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetLimitUsd, Unit: USD }
        CostTypes: { IncludeCredit: false, IncludeRefund: false }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers:
            - { SubscriptionType: SNS, Address: !Ref BudgetTopic }
            - !If [HasEmail, { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }, !Ref AWS::NoValue]
        - !If
          - HasEmail
          - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
            Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
          - !Ref AWS::NoValue
        - !If
          - HasEmail
          - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
            Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
          - !Ref AWS::NoValue

Outputs:
  FunctionUrl:
    Description: Public base URL (MCP endpoint is <url>mcp)
    Value: !GetAtt ScaffoldFunctionUrl.FunctionUrl
  EventsTableName:
    Value: !Ref EventsTable
  FunctionName:
    Description: Throttled to zero by the budget guard at the cost cap
    Value: !Ref ScaffoldFunction
